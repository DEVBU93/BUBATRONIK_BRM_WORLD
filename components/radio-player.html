<!-- Reproductor propio de Radio Bubatronik BRM -->
<div id="radio-player" style="position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-xl);padding:16px;box-shadow:var(--shadow-lg);z-index:9999;max-width:320px;">
  <div style="display:flex;align-items:center;gap:12px;">
    <button id="play-pause" style="background:var(--cyan);color:var(--bg);border:none;border-radius:var(--radius-full);width:48px;height:48px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;">▶</button>
    <div style="flex:1;">
      <div style="font-weight:700;color:var(--text);font-size:14px;">Radio Bubatronik BRM</div>
      <div id="status" style="font-size:12px;color:var(--text-muted);">Listo para reproducir</div>
    </div>
    <a href="https://bubatronik.listen2myradio.com/" target="_blank" rel="noopener" style="background:var(--panel);border:1px solid var(--line);color:var(--cyan);padding:6px 12px;border-radius:var(--radius-md);font-size:12px;text-decoration:none;">Web Externa</a>
  </div>
  <audio id="audio-stream" preload="none" style="display:none;">
    <!-- URL del stream de radio (actualizar con la URL real del stream) -->
    <source src="https://bubatronik.listen2myradio.com/" type="audio/mpeg">
    Tu navegador no soporta el elemento de audio.
  </audio>
</div>

<script>
(function() {
  const audio = document.getElementById('audio-stream');
  const playBtn = document.getElementById('play-pause');
  const status = document.getElementById('status');
  let isPlaying = false;

  playBtn.addEventListener('click', () => {
    if (isPlaying) {
      audio.pause();
      playBtn.textContent = '▶';
      status.textContent = 'Pausado';
      isPlaying = false;
    } else {
      audio.play();
      playBtn.textContent = '⏸';
      status.textContent = 'Reproduciendo...';
      isPlaying = true;
    }
  });

  audio.addEventListener('playing', () => {
    status.textContent = 'En directo · brm.worldmos.world';
  });

  audio.addEventListener('error', () => {
    status.textContent = 'Error al cargar el stream';
  });
})();
</script>
